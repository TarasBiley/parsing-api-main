stages:
  - build
  - deploy

variables:
  DOCKER_COMPOSE_VERSION: "2.29.1"

before_script:
  - apk update && apk add --no-cache docker-compose

.build:
  stage: build
  script:
    - cp $env .env
    - echo "$ALLOWED_IPS" | tr ',' '\n' | sed 's/^/allow /; s/$/;/' > $CI_PROJECT_DIR/src/nginx_config/whitelist.conf
    - for i in {1..3}; do
        DOCKER_HOST=$HOST docker-compose build && break || sleep 5;
      done
  retry: 2

build:dev:
  extends:
   - .build
  before_script:
    - HOST=$HOST_DEV
    - env=$env_dev
    - ALLOWED_IPS=$ALLOWED_IPS_DEV
  only:
    - main

build:prod:
  extends:
   - .build
  before_script:
    - HOST=$HOST_PROD
    - env=$env_prod
    - ALLOWED_IPS=$ALLOWED_IPS_PROD
    - scp $CI_PROJECT_DIR/redis.conf $PROD_DIR/redis.conf
    - scp $CI_PROJECT_DIR/src/nginx.conf $PROD_DIR/src/nginx.conf
    - scp $CI_PROJECT_DIR/src/nginx_config/site.conf $PROD_DIR/src/nginx_config/site.conf
  after_script:
    - scp $CI_PROJECT_DIR/src/nginx_config/whitelist.conf $PROD_DIR/src/nginx_config/whitelist.conf
  only:
    - PRODUCTION

.deploy:
  stage: deploy
  script:
    - cp $env .env
    - echo "$ALLOWED_IPS" | tr ',' '\n' | sed 's/^/allow /; s/$/;/' > $CI_PROJECT_DIR/src/nginx_config/whitelist.conf
    - DOCKER_HOST=$HOST docker-compose up -d

deploy:dev:
  extends:
   - .deploy
  before_script:
    - HOST=$HOST_DEV
    - env=$env_dev
    - ALLOWED_IPS=$ALLOWED_IPS_DEV
  only:
    - main

deploy:prod:
  extends:
   - .deploy
  before_script:
    - HOST=$HOST_PROD
    - env=$env_prod
    - ALLOWED_IPS=$ALLOWED_IPS_PROD
  only:
    - PRODUCTION
