server {
    listen       8000 default_server;
    listen       [::]:8000 default_server;
    server_name  _;

    root /data;

    location @backend {
        proxy_pass http://parse_service:8000;
    }

    location = /metrics {
        try_files $uri @backend;
    }

    location ~ (/api/.*) {
        try_files $uri @backend;
    }

    error_page  404              /404.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
